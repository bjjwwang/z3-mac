name: Build Z3 macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-z3-macos.yml"
      - "README.md"

permissions:
  contents: read

env:
  Z3_VERSION: "4.15.4"
  ARTIFACT_BASENAME: "z3-4.15.4-arm64-macos-14"

jobs:
  build:
    name: Build Z3 4.15.4 on macos-14
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show runner environment
        run: |
          sw_vers
          uname -a
          xcodebuild -version
          cmake --version

      - name: Install build tools
        run: |
          brew install ninja

      - name: Download Z3 source
        run: |
          curl -fsSL \
            -o z3.zip \
            "https://github.com/Z3Prover/z3/archive/refs/tags/z3-${Z3_VERSION}.zip"
          unzip -q z3.zip
          test -d "z3-z3-${Z3_VERSION}"

      - name: Configure Z3
        run: |
          cmake \
            -S "z3-z3-${Z3_VERSION}" \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/z3.install" \
            -DZ3_BUILD_LIBZ3_SHARED=ON

      - name: Build and install Z3
        run: |
          cmake --build build --target install --parallel "$(sysctl -n hw.logicalcpu)"

      - name: Create z3.obj layout
        run: |
          rm -rf z3.obj
          mkdir -p z3.obj/bin z3.obj/include
          cp -R z3.install/include/. z3.obj/include/

          if [ -f z3.install/bin/libz3.dylib ]; then
            cp z3.install/bin/libz3.dylib z3.obj/bin/libz3.dylib
          elif [ -f z3.install/lib/libz3.dylib ]; then
            cp z3.install/lib/libz3.dylib z3.obj/bin/libz3.dylib
          else
            echo "libz3.dylib was not produced by the build."
            find z3.install -maxdepth 3 -type f | sort
            exit 1
          fi

          install_name_tool -id libz3.dylib z3.obj/bin/libz3.dylib
          grep "Z3_.*VERSION" z3.obj/include/z3_version.h
          file z3.obj/bin/libz3.dylib
          otool -D z3.obj/bin/libz3.dylib
          otool -L z3.obj/bin/libz3.dylib

      - name: Package z3.obj
        run: |
          ditto -c -k --keepParent z3.obj "${ARTIFACT_BASENAME}.zip"
          unzip -l "${ARTIFACT_BASENAME}.zip"

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASENAME }}
          path: ${{ env.ARTIFACT_BASENAME }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Write artifact summary
        run: |
          {
            echo "### Z3 macOS artifact"
            echo
            echo "- Z3 version: ${Z3_VERSION}"
            echo "- Runner: macos-14"
            echo "- Archive: ${ARTIFACT_BASENAME}.zip"
            echo "- Layout: z3.obj/bin/libz3.dylib and z3.obj/include/*.h"
            echo "- Artifact URL: ${{ steps.upload.outputs.artifact-url }}"
          } >> "${GITHUB_STEP_SUMMARY}"
